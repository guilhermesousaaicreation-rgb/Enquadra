name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q .github/workflows/Enquadra-Android.zip
      - run: sed -i 's/exposureCompensationState/exposureState/' Enquadra/app/src/main/java/pt/enquadra/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon
        working-directory: Enquadra
      - uses: actions/upload-artifact@v4
        with:
          name: Enquadra-APK
          path: Enquadra/app/build/outputs/apk/debug/*.apk
